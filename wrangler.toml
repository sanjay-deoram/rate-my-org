name = "rate-my-org"
compatibility_date = "2025-05-29"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

routes = [
  { pattern = "rate-my-org.com/*", zone_name = "rate-my-org.com" },
  { pattern = "www.rate-my-org.com/*", zone_name = "rate-my-org.com" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "R2"
bucket_name = "companies-logo"

# Non-secret vars (secrets are set via: wrangler secret put SECRET_NAME)
[vars]
NEXT_PUBLIC_LOGO_CDN = "https://cdn.rate-my-org.com"

[[unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "READ_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
